version: 2
updates:
  # npm / pnpm dependencies (root workspace)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      angular:
        patterns:
          - "@angular*"
          - "ng-packagr"
          - "zone.js"
      nx:
        patterns:
          - "@nx/*"
          - "nx"
      storybook:
        patterns:
          - "@storybook/*"
          - "storybook"
      dev-dependencies:
        dependency-type: "development"
        exclude-patterns:
          - "@angular*"
          - "@nx/*"
          - "nx"
          - "@storybook/*"
          - "storybook"
    ignore:
      # ng-packagr and zone.js track Angular's major version — never let them
      # cross-major ahead of Angular (e.g. ng-packagr 22 on Angular 20 breaks
      # the library build). They move deliberately when Angular is upgraded.
      - dependency-name: "ng-packagr"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zone.js"
        update-types: ["version-update:semver-major"]
      # Hold ESLint on 9.x — a major needs coordinated flat-config + plugin
      # updates (typescript-eslint, angular-eslint), done deliberately.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  # GitHub Actions used in workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
